name: Deploy Virtual Tour to GitHub Pages

on:
  push:
    branches: [main, claude/zealous-heisenberg-9t3q0p]
    paths:
      - 'public/tour/**'
      - '.github/workflows/deploy-tour.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload tour artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/tour

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
