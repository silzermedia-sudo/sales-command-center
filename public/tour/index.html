// ── Textures ──────────────────────────────────────────────────────────────
function makeParquet() {
  const S = 1024;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const cx = cv.getContext('2d');
  const PW = 90, PH = 17;
  const cols = ['#7C5B28','#8B6830','#6E4E1E','#956E34','#7A5A27','#835D2B','#714E1D'];
  for (let r = 0; r < Math.ceil(S / PH) + 1; r++) {
    const ox = (r % 2) * (PW * 0.5);
    for (let c = -1; c < Math.ceil(S / PW) + 1; c++) {
      const x = c * PW - ox, y = r * PH;
      cx.fillStyle = cols[(r * 5 + c * 3 + 7) % cols.length];
      cx.fillRect(x + 1, y + 1, PW - 2, PH - 2);
      cx.globalAlpha = 0.055;
      cx.strokeStyle = '#1a0800';
      cx.lineWidth = 0.7;
      for (let g = 9; g < PW - 4; g += 16) {
        cx.beginPath();
        cx.moveTo(x + g, y + 1);
        cx.quadraticCurveTo(x + g + 2, y + PH * 0.5, x + g + 1, y + PH - 1);
        cx.stroke();
      }
      cx.globalAlpha = 1;
    }
  }
  const grd = cx.createLinearGradient(0, 0, S, S);
  grd.addColorStop(0, 'rgba(255,225,140,0.07)');
  grd.addColorStop(1, 'rgba(0,0,0,0.07)');
  cx.fillStyle = grd;
  cx.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function makeWallTex(hex) {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const cx = cv.getContext('2d');
  cx.fillStyle = hex;
  cx.fillRect(0, 0, S, S);
  for (let i = 0; i < 7000; i++) {
    const b = Math.random() > 0.5 ? 255 : 0;
    cx.fillStyle = `rgba(${b},${b},${b},${Math.random() * 0.022})`;
    cx.fillRect(Math.random() * S, Math.random() * S, Math.random() * 2.2, Math.random() * 2.2);
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function makeTileTex() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#D8D4CE';
  cx.fillRect(0, 0, S, S);
  const TS = 64;
  cx.strokeStyle = 'rgba(180,176,170,0.8)';
  cx.lineWidth = 1.2;
  for (let x = 0; x <= S; x += TS) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, S); cx.stroke(); }
  for (let y = 0; y <= S; y += TS) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(S, y); cx.stroke(); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function addBox(w, h, d, mat, x, y, z, ry) {

  m.position.set(x, y, z);
  if (ry) m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function addWall(w, h, d, mat, x, z, ry) {

];

function flyTo(p) {
  const s = {
    px: camera.position.x, py: camera.position.y, pz: camera.position.z,
    tx: controls.target.x, ty: controls.target.y, tz: controls.target.z
  };
  function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  const dur = 1400, t0 = performance.now();
  function step(now) {
    const t = Math.min((now - t0) / dur, 1), e = ease(t);
    camera.position.set(s.px + (p.pos[0] - s.px) * e, s.py + (p.pos[1] - s.py) * e, s.pz + (p.pos[2] - s.pz) * e);
    controls.target.set(s.tx + (p.target[0] - s.tx) * e, s.ty + (p.target[1] - s.ty) * e, s.tz + (p.target[2] - s.tz) * e);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

document.querySelectorAll('.rm').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.rm').forEach(r => r.classList.remove('active'));
    el.classList.add('active');
    flyTo(presets[+el.dataset.idx]);
  });
});

setTimeout(() => document.getElementById('hint').classList.add('gone'), 5000);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
