<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Tour · Demo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; touch-action: none; }
    canvas { display: block; }

    #ui {
      position: fixed; inset: 0;
      pointer-events: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    #label {
      position: absolute; top: 28px; left: 28px;
      color: rgba(255,245,220,0.85);
      font-size: 10px; font-weight: 300; letter-spacing: 4px;
      text-transform: uppercase;
    }

    #hint {
      position: absolute;
      bottom: 36px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.45);
      font-size: 10px; font-weight: 300; letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 2s;
    }
    #hint.gone { opacity: 0; }

    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0a;
      color: rgba(255,255,255,0.6);
      font-size: 11px; letter-spacing: 3px;
      text-transform: uppercase;
      transition: opacity 0.8s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #bar-wrap {
      width: 120px; height: 1px;
      background: rgba(255,255,255,0.15);
      margin-top: 16px;
    }
    #bar { height: 100%; width: 0%; background: rgba(197,160,40,0.9); transition: width 0.2s; }
  </style>
</head>
<body>

<div id="loading">
  <span>Modell wird geladen</span>
  <div id="bar-wrap"><div id="bar"></div></div>
</div>

<div id="ui">
  <div id="label">3D Tour · Demo</div>
  <div id="hint">Ein Finger · Drehen &nbsp;|&nbsp; Zwei Finger · Zoom</div>
</div>

<!-- Three.js + loaders from CDN -->
<script async src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script async src="https://unpkg.com/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
<script async src="https://unpkg.com/three@0.158.0/examples/js/controls/OrbitControls.js"></script>
<script async src="https://unpkg.com/three@0.158.0/examples/js/loaders/RGBELoader.js"></script>

<script>
// Wait until all scripts are loaded
window.addEventListener('load', () => {
  // ─── RENDERER ──────────────────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // ─── SCENE ─────────────────────────────────────────────────────────────────
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  // ─── CAMERA ────────────────────────────────────────────────────────────────
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 100);
  camera.position.set(0, 1.5, 3);

  // ─── CONTROLS ──────────────────────────────────────────────────────────────
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 0.5;
  controls.maxDistance = 8;
  controls.maxPolarAngle = Math.PI * 0.85;
  controls.target.set(0, 0.8, 0);
  controls.update();

  // ─── LIGHTING ──────────────────────────────────────────────────────────────
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
  dirLight.position.set(3, 6, 4);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  dirLight.shadow.camera.near = 0.1;
  dirLight.shadow.camera.far = 20;
  dirLight.shadow.bias = -0.001;
  scene.add(dirLight);

  const fillLight = new THREE.DirectionalLight(0xc8d8ff, 0.3);
  fillLight.position.set(-3, 2, -2);
  scene.add(fillLight);

  // ─── LOAD GLB ──────────────────────────────────────────────────────────────
  const bar = document.getElementById('bar');
  const loadingEl = document.getElementById('loading');
  const hint = document.getElementById('hint');

  const loader = new THREE.GLTFLoader();

  // Free bathroom interior model from Three.js examples
  const MODEL_URL = 'https://threejs.org/examples/models/gltf/bath_day.glb';

  loader.load(
    MODEL_URL,
    (gltf) => {
      const model = gltf.scene;

      // Center model
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      model.position.y += size.y / 2;

      // Auto-fit camera
      const maxDim = Math.max(size.x, size.y, size.z);
      camera.position.set(0, size.y * 0.6, maxDim * 1.4);
      controls.target.set(0, size.y * 0.3, 0);
      controls.maxDistance = maxDim * 4;
      controls.minDistance = maxDim * 0.1;
      controls.update();

      // Shadows on all meshes
      model.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(model);

      // Hide loading screen
      bar.style.width = '100%';
      setTimeout(() => {
        loadingEl.classList.add('done');
        setTimeout(() => hint.classList.add('gone'), 4000);
      }, 400);
    },
    (progress) => {
      if (progress.total > 0) {
        bar.style.width = (progress.loaded / progress.total * 100) + '%';
      }
    },
    (error) => {
      document.getElementById('loading').innerHTML =
        '<span style="color:rgba(255,100,100,0.8)">Modell konnte nicht geladen werden</span>';
      console.error(error);
    }
  );

  // ─── ANIMATE ───────────────────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ─── RESIZE ────────────────────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
});
</script>
</body>
</html>
