<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wohnungs-Tour · Obergeschoss</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #100C08; touch-action: none; }
    canvas { display: block; }

    #ui {
      position: fixed; inset: 0;
      pointer-events: none;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    #room-name {
      position: absolute; top: 32px; left: 32px;
      color: rgba(255,245,220,0.92);
      font-size: 11px; font-weight: 300; letter-spacing: 4px;
      text-transform: uppercase;
      transition: opacity 0.6s;
    }
    #room-size {
      position: absolute; top: 52px; left: 32px;
      color: rgba(255,245,220,0.42);
      font-size: 10px; font-weight: 300; letter-spacing: 2px;
      transition: opacity 0.6s;
    }

    #hint {
      position: absolute; bottom: 56px;
      left: 50%; transform: translateX(-50%);
      color: rgba(255,245,220,0.55);
      font-size: 10px; font-weight: 300; letter-spacing: 3px;
      text-transform: uppercase;
      transition: opacity 1.5s;
      white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }

    #track {
      position: absolute; bottom: 28px;
      left: 50%; transform: translateX(-50%);
      width: 120px; height: 1px;
      background: rgba(255,245,220,0.18);
    }
    #fill {
      height: 100%; width: 0%;
      background: rgba(197,160,40,0.85);
      transition: width 0.08s linear;
    }

    #logo {
      position: absolute; bottom: 30px; right: 32px;
      color: rgba(255,245,220,0.25);
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    }
  </style>
</head>
<body>
<div id="ui">
  <div id="room-name">Eltern</div>
  <div id="room-size">21,95 m²</div>
  <div id="hint">← Swipe zum Navigieren →</div>
  <div id="track"><div id="fill"></div></div>
  <div id="logo">OG · Tour</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';

// ─── RENDERER ────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

// ─── SCENE ───────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF2EBE0);
scene.fog = new THREE.Fog(0xF2EBE0, 8, 22);

// ─── CAMERA ──────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.05, 40);

// ─── TEXTURE FACTORY ─────────────────────────────────────────────────────────
function makeParquetTexture() {
  const S = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');

  // Dark base
  ctx.fillStyle = '#2E1608';
  ctx.fillRect(0, 0, S, S);

  // Plank settings (herringbone-ish staggered rows)
  const PW = 50;   // plank width (short axis)
  const PL = 200;  // plank length

  const palette = ['#7B4A2D','#6A3C1F','#8A5535','#704228','#7F4E30','#5F3215'];

  for (let row = -1; row < Math.ceil(S / PW) + 1; row++) {
    const offset = (row % 2 === 0) ? 0 : PL / 2;
    for (let col = -1; col < Math.ceil(S / PL) + 2; col++) {
      const x = col * PL - offset;
      const y = row * PW;

      const ci = Math.abs((row * 3 + col * 7)) % palette.length;
      const baseColor = palette[ci];
      const rC = parseInt(baseColor.slice(1, 3), 16);
      const gC = parseInt(baseColor.slice(3, 5), 16);
      const bC = parseInt(baseColor.slice(5, 7), 16);
      const shade = 0.88 + Math.random() * 0.12;

      // Fill plank
      ctx.fillStyle = `rgb(${~~(rC*shade)},${~~(gC*shade)},${~~(bC*shade)})`;
      ctx.fillRect(x + 1, y + 1, PL - 2, PW - 2);

      // Wood grain streaks
      ctx.lineWidth = 0.6;
      for (let g = 1; g < 7; g++) {
        const gx = x + g * (PL / 7) + (Math.random() - 0.5) * 5;
        const alpha = 0.06 + Math.random() * 0.14;
        ctx.strokeStyle = `rgba(0,0,0,${alpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.moveTo(gx, y + 2);
        ctx.bezierCurveTo(
          gx + (Math.random() - 0.5) * 4, y + PW * 0.33,
          gx + (Math.random() - 0.5) * 4, y + PW * 0.67,
          gx + (Math.random() - 0.5) * 4, y + PW - 2
        );
        ctx.stroke();
      }

      // Gap / shadow between planks
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 0.75, y + 0.75, PL - 1.5, PW - 1.5);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2.5, 2.5);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function makeWallTexture(hexColor) {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.fillStyle = hexColor;
  ctx.fillRect(0, 0, S, S);
  // Subtle plaster noise
  for (let i = 0; i < 6000; i++) {
    const a = Math.random() * 0.025;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(255,255,255,${a.toFixed(3)})`
      : `rgba(0,0,0,${a.toFixed(3)})`;
    ctx.fillRect(Math.random() * S, Math.random() * S, 1 + Math.random(), 1 + Math.random());
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1.5, 1);
  return tex;
}

// ─── MATERIALS ───────────────────────────────────────────────────────────────
const parquetTex = makeParquetTexture();
const wallTex    = makeWallTexture('#CCC2B0');  // warm greige

const M = {
  floor:     new THREE.MeshLambertMaterial({ map: parquetTex }),
  wall:      new THREE.MeshLambertMaterial({ map: wallTex, color: 0xCCC2B0 }),
  ceiling:   new THREE.MeshLambertMaterial({ color: 0xF0EBE2 }),
  brass:     new THREE.MeshLambertMaterial({ color: 0xB8941E }),
  white:     new THREE.MeshLambertMaterial({ color: 0xF5F1EC }),
  darkWood:  new THREE.MeshLambertMaterial({ color: 0x2C1505 }),
  medWood:   new THREE.MeshLambertMaterial({ color: 0x5A3010 }),
  linen:     new THREE.MeshLambertMaterial({ color: 0xD8C9AF }),
  linenDark: new THREE.MeshLambertMaterial({ color: 0x8C7057 }),
  fabric:    new THREE.MeshLambertMaterial({ color: 0xC4B49A }),
  glass:     new THREE.MeshLambertMaterial({ color: 0xBED4E0, transparent: true, opacity: 0.28 }),
  frameWood: new THREE.MeshLambertMaterial({ color: 0xEDE6D9 }),
  terracotta:new THREE.MeshLambertMaterial({ color: 0xB56B50 }),
  bookA:     new THREE.MeshLambertMaterial({ color: 0x7A5240 }),
  bookB:     new THREE.MeshLambertMaterial({ color: 0x4A6070 }),
  rug:       new THREE.MeshLambertMaterial({ color: 0x9C8468 }),
  lampShade: new THREE.MeshLambertMaterial({ color: 0xEED8B0, side: THREE.DoubleSide }),
};

// ─── GEOMETRY HELPERS ────────────────────────────────────────────────────────
function box(w, h, d, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

function addToGroup(g, w, h, d, mat, x, y, z, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = true;
  m.receiveShadow = true;
  g.add(m);
  return m;
}

function cyl(g, rTop, rBot, h, mat, x, y, z, segs = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, segs), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  g ? g.add(m) : scene.add(m);
  return m;
}

function sphere(g, r, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 10), mat);
  m.position.set(x, y, z);
  g ? g.add(m) : scene.add(m);
  return m;
}

// ─── ROOM BUILDER ─────────────────────────────────────────────────────────────
// openings: array of { side:'left'|'right'|'front'|'back', center:z_or_x, width }
function buildRoom(cx, cz, rw, rd, rh, openings = []) {
  const hw = rw / 2, hd = rd / 2;
  const doorH = 2.1;

  // Floor & ceiling
  box(rw, 0.02, rd, M.floor,   cx, 0,      cz);
  box(rw, 0.05, rd, M.ceiling, cx, rh,     cz);

  // Each wall with optional doorway cut-out
  function wallWithDoor(side) {
    const op = openings.find(o => o.side === side);
    if (!side) return;

    let wx, wz, ww, wd_ext;
    let isZ = (side === 'back' || side === 'front');

    if (isZ) {
      wz = side === 'back' ? cz - hd : cz + hd;
      ww = rw; wd_ext = 0.12;
      if (!op) {
        box(ww, rh, wd_ext, M.wall, cx, rh/2, wz);
        return;
      }
      const dw = op.width, dc = op.center || 0;
      const side1 = (rw/2 + dc - dw/2);
      const side2 = (rw/2 - dc - dw/2);
      if (side1 > 0.05) box(side1, rh, wd_ext, M.wall, cx - hw + side1/2, rh/2, wz);
      if (side2 > 0.05) box(side2, rh, wd_ext, M.wall, cx + hw - side2/2, rh/2, wz);
      if (rh - doorH > 0.05) box(dw, rh - doorH, wd_ext, M.wall, cx + dc, rh - (rh-doorH)/2, wz);
    } else {
      wx = side === 'left' ? cx - hw : cx + hw;
      ww = 0.12; wd_ext = rd;
      if (!op) {
        box(ww, rh, wd_ext, M.wall, wx, rh/2, cz);
        return;
      }
      const dw = op.width, dc = op.center || 0;
      const side1 = (rd/2 + dc - dw/2);
      const side2 = (rd/2 - dc - dw/2);
      if (side1 > 0.05) box(ww, rh, side1, M.wall, wx, rh/2, cz - hd + side1/2);
      if (side2 > 0.05) box(ww, rh, side2, M.wall, wx, rh/2, cz + hd - side2/2);
      if (rh - doorH > 0.05) box(ww, rh - doorH, dw, M.wall, wx, rh - (rh-doorH)/2, cz + dc);
    }
  }

  wallWithDoor('back');
  wallWithDoor('front');
  wallWithDoor('left');
  wallWithDoor('right');
}

// ─── FURNITURE ────────────────────────────────────────────────────────────────

function buildDoubleBed(px, pz) {
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(px, 0, pz);

  // Platform frame
  addToGroup(g, 2.05, 0.18, 2.2, M.darkWood,  0, 0.09, 0);
  // Mattress
  addToGroup(g, 1.85, 0.24, 2.0,  M.white,     0, 0.30, 0.02);
  // Duvet
  addToGroup(g, 1.82, 0.10, 1.4,  M.linen,     0, 0.47, 0.30);
  // Duvet fold at foot
  addToGroup(g, 1.82, 0.06, 0.18, M.linenDark, 0, 0.44, 0.98);
  // Pillows x2
  for (const sx of [-0.44, 0.44]) {
    addToGroup(g, 0.72, 0.10, 0.48, M.white, sx, 0.46, -0.70);
  }
  // Headboard (wall-mounted padded panel)
  addToGroup(g, 1.92, 0.90, 0.09, M.linenDark, 0, 0.90, -1.08);
  addToGroup(g, 1.86, 0.84, 0.04, M.fabric,    0, 0.90, -1.02);
  // Small throw blanket on one side
  addToGroup(g, 0.50, 0.04, 0.55, M.linenDark, -0.55, 0.50, 0.30);
}

function buildNightstand(px, pz) {
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(px, 0, pz);

  // USM Haller single cube: white panel + brass nodes + legs
  const cw = 0.38, ch = 0.38, cd = 0.38;

  addToGroup(g, cw, ch, cd, M.white, 0, ch/2 + 0.17, 0);

  // Brass connector nodes at 8 corners of the cube
  for (const bx of [-cw/2, cw/2]) {
    for (const by of [0.17, 0.17 + ch]) {
      for (const bz of [-cd/2, cd/2]) {
        sphere(g, 0.032, M.brass, bx, by, bz);
      }
    }
  }
  // Brass legs (4x)
  for (const [lx, lz] of [[-cw/2, -cd/2],[cw/2, -cd/2],[-cw/2, cd/2],[cw/2, cd/2]]) {
    cyl(g, 0.012, 0.012, 0.17, M.brass, lx, 0.085, lz, 8);
  }
  // Horizontal brass rails (4 edges of cube)
  for (const by of [0.17, 0.17 + ch]) {
    addToGroup(g, cw, 0.016, 0.016, M.brass, 0, by, -cd/2);
    addToGroup(g, cw, 0.016, 0.016, M.brass, 0, by,  cd/2);
    addToGroup(g, 0.016, 0.016, cd, M.brass, -cw/2, by, 0);
    addToGroup(g, 0.016, 0.016, cd, M.brass,  cw/2, by, 0);
  }

  // Book on top
  addToGroup(g, 0.16, 0.022, 0.11, M.bookA, -0.04, 0.17+ch+0.011, 0.02);
  // Small candle
  cyl(g, 0.022, 0.022, 0.09, new THREE.MeshLambertMaterial({color:0xF5E8C8}), 0.10, 0.17+ch+0.045, -0.05, 8);
}

function buildUSMShelf(px, pz, ry, cols = 3, rows = 2) {
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(px, 0, pz);
  g.rotation.y = ry;

  const cw = 0.375, ch = 0.36, cd = 0.38;
  const totalW = cw * cols;
  const totalH = ch * rows;

  // White panels per cell
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      addToGroup(g, cw - 0.018, ch - 0.018, cd - 0.018, M.white,
        (c - (cols-1)/2) * cw, r * ch + ch/2, 0);
    }
  }

  // Brass horizontal rails
  for (let r = 0; r <= rows; r++) {
    addToGroup(g, totalW + 0.016, 0.016, 0.016, M.brass, 0, r * ch, -cd/2);
    addToGroup(g, totalW + 0.016, 0.016, 0.016, M.brass, 0, r * ch,  cd/2);
  }
  // Brass vertical rails
  for (let c = 0; c <= cols; c++) {
    const x = (c - cols/2) * cw;
    addToGroup(g, 0.016, totalH + 0.016, 0.016, M.brass, x, totalH/2, -cd/2);
    addToGroup(g, 0.016, totalH + 0.016, 0.016, M.brass, x, totalH/2,  cd/2);
  }
  // Brass connector nodes
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const x = (c - cols/2) * cw;
      sphere(g, 0.038, M.brass, x, r * ch, -cd/2);
      sphere(g, 0.038, M.brass, x, r * ch,  cd/2);
    }
  }

  // Decor items on top shelf
  if (rows >= 1) {
    const ty = rows * ch + 0.02;
    // Small vase
    cyl(g, 0.05, 0.035, 0.22, M.terracotta, -totalW/2 + 0.10, ty + 0.11, 0, 12);
    // Book stack
    for (let bi = 0; bi < 3; bi++) {
      const bmat = bi % 2 === 0 ? M.bookA : M.bookB;
      addToGroup(g, 0.04, 0.17 - bi*0.03, 0.22, bmat, -totalW/2 + 0.35, ty + (0.17 - bi*0.03)/2, 0);
    }
  }
}

function buildFloorLamp(px, pz) {
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(px, 0, pz);

  // Marble base disc
  cyl(g, 0.15, 0.15, 0.04, new THREE.MeshLambertMaterial({color:0xD8D0C0}), 0, 0.02, 0, 16);
  // Slim brass stem
  cyl(g, 0.013, 0.018, 1.48, M.brass, 0, 0.78, 0, 10);
  // Lamp shade
  const shadeGeo = new THREE.CylinderGeometry(0.20, 0.28, 0.22, 20, 1, true);
  const shade = new THREE.Mesh(shadeGeo, M.lampShade);
  shade.position.set(0, 1.56, 0);
  g.add(shade);
  // Top cap
  cyl(g, 0.202, 0.202, 0.012, new THREE.MeshLambertMaterial({color:0xD8C89A}), 0, 1.676, 0, 20);

  // Warm point light
  const pl = new THREE.PointLight(0xFFE0A0, 1.0, 5.5);
  pl.position.set(0, 1.48, 0);
  g.add(pl);
}

function buildRug(cx, cz, rw, rd) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(rw, 0.014, rd), M.rug);
  m.position.set(cx, 0.007, cz);
  m.receiveShadow = true;
  scene.add(m);
}

function buildWindow(x, y, z, ww, wh, ry = 0) {
  // Outer frame
  const frameD = 0.10;
  const makeBar = (bw, bh, bd, bx, by, bz) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), M.frameWood);
    m.position.set(bx, by, bz);
    m.rotation.y = ry;
    scene.add(m);
  };
  const ox = Math.cos(ry) * 0, oz = Math.sin(ry) * 0;
  makeBar(ww + 0.12, 0.08, frameD, x, y + wh/2 + 0.04, z);
  makeBar(ww + 0.12, 0.08, frameD, x, y - wh/2 - 0.04, z);
  makeBar(0.08, wh + 0.08, frameD, x - (ww/2 + 0.04) * Math.cos(ry), y, z + (ww/2 + 0.04) * Math.sin(ry));
  makeBar(0.08, wh + 0.08, frameD, x + (ww/2 + 0.04) * Math.cos(ry), y, z - (ww/2 + 0.04) * Math.sin(ry));
  // Glass pane
  const gm = new THREE.Mesh(new THREE.BoxGeometry(ww, wh, 0.04), M.glass);
  gm.position.set(x, y, z);
  gm.rotation.y = ry;
  scene.add(gm);
  // Cross divider
  makeBar(ww, 0.04, frameD * 0.6, x, y, z);
  makeBar(0.04, wh, frameD * 0.6, x, y, z);

  // Warm directional window light
  const wl = new THREE.DirectionalLight(0xFFF5E0, 0.45);
  wl.position.set(x + Math.sin(ry + Math.PI/2) * 4, y + 2, z + Math.cos(ry + Math.PI/2) * 4);
  wl.target.position.set(x, y - 1, z);
  scene.add(wl);
  scene.add(wl.target);
}

function buildEamesChair(px, pz, ry = 0) {
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(px, 0, pz);
  g.rotation.y = ry;

  const shellMat = new THREE.MeshLambertMaterial({ color: 0xDDB87A }); // warm ochre shell
  // Seat
  addToGroup(g, 0.52, 0.06, 0.48, shellMat, 0, 0.46, 0.01);
  // Back (slightly angled)
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.40, 0.045), shellMat);
  back.position.set(0, 0.67, -0.22);
  back.rotation.x = 0.16;
  g.add(back);
  // Metal Eiffel legs
  const legMat = new THREE.MeshLambertMaterial({ color: 0xBBBBBB });
  for (const [lx, lz, rx] of [
    [-0.17, -0.17,  0.10], [ 0.17, -0.17,  0.10],
    [-0.17,  0.19, -0.10], [ 0.17,  0.19, -0.10],
  ]) {
    const lm = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.46, 8), legMat);
    lm.position.set(lx, 0.23, lz);
    lm.rotation.x = rx;
    g.add(lm);
  }
}

function buildSmallTable(px, pz) {
  const g = new THREE.Group();
  scene.add(g);
  g.position.set(px, 0, pz);

  addToGroup(g, 1.20, 0.04, 0.55, M.darkWood, 0, 0.74, 0);
  for (const [lx, lz] of [[-0.56, -0.24],[0.56, -0.24],[-0.56, 0.24],[0.56, 0.24]]) {
    cyl(g, 0.022, 0.022, 0.74, M.medWood, lx, 0.37, lz, 8);
  }
  // Potted plant
  cyl(g, 0.06, 0.05, 0.10, M.terracotta, 0.40, 0.79, 0.10, 10);
  const plantMat = new THREE.MeshLambertMaterial({color:0x3D6B30});
  sphere(g, 0.11, plantMat, 0.40, 0.92, 0.10);
}

function buildBooks(px, py, pz, count = 5) {
  const colors = [0x7A5240, 0x4A6070, 0x7A7040, 0x604858, 0x506040];
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.04 + Math.random()*0.02, 0.22 + Math.random()*0.04, 0.18), new THREE.MeshLambertMaterial({color:colors[i%colors.length]}));
    m.position.set(px + i * 0.055, py, pz);
    scene.add(m);
  }
}

// ─── LIGHTING ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xFFEED8, 0.55));

const sun = new THREE.DirectionalLight(0xFFF8E8, 0.70);
sun.position.set(-3, 10, -8);
sun.castShadow = true;
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top  =  10; sun.shadow.camera.bottom = -10;
sun.shadow.camera.far  = 40;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xD8E8FF, 0.18);
fill.position.set(6, 5, 6);
scene.add(fill);

// ─── BUILD SCENE ─────────────────────────────────────────────────────────────
const H = 2.65; // ceiling height

// ── ELTERN ROOM ─────────────────────────────────────────────────────────────
// Center at (-4.2, 0, -2.3), 5.5m wide, 4.4m deep
// Door in right wall (+x), centered at z = -2.3 (z-offset 0), width 1.0m
const EX = -4.2, EZ = -2.3, EW = 5.5, ED = 4.4;

buildRoom(EX, EZ, EW, ED, H, [
  { side: 'right', center: 0, width: 1.1 },
]);

// Windows on back wall (north, -z)
buildWindow(EX - 1.2, 1.35, EZ - ED/2 - 0.06, 1.1, 1.35);
buildWindow(EX + 1.0, 1.35, EZ - ED/2 - 0.06, 0.9, 1.35);

// Bed centered against back wall
buildDoubleBed(EX - 0.2, EZ - 1.0);
buildNightstand(EX - 0.2 - 1.18, EZ - 1.0);
buildNightstand(EX - 0.2 + 1.18, EZ - 1.0);
buildUSMShelf(EX - EW/2 + 0.21, EZ + 0.8, Math.PI/2, 4, 2);
buildFloorLamp(EX + 1.6, EZ - 0.8);
buildRug(EX - 0.2, EZ + 0.1, 3.0, 1.8);

// ── HALLWAY ──────────────────────────────────────────────────────────────────
// Connecting corridor between rooms, x range [-1.45, 0.45]
const HX = -0.5, HZ = -2.3, HW = 1.9, HD = 4.4;

// Floor & ceiling only (open on left/right)
box(HW, 0.02, HD, M.floor,   HX, 0,  HZ);
box(HW, 0.05, HD, M.ceiling, HX, H,  HZ);
// Back wall (north side of corridor)
box(HW, H, 0.12, M.wall, HX, H/2, HZ - HD/2);
// Front wall (south side of corridor, partial — staircase area)
box(HW * 0.4, H, 0.12, M.wall, HX - HW*0.3, H/2, HZ + HD/2);

// ── ZIMMER 1 ─────────────────────────────────────────────────────────────────
// Center at (3.3, 0, -2.3), 5.0m wide, 4.4m deep
// Door in left wall (-x), centered at z = -2.3, width 1.0m
const Z1X = 3.3, Z1Z = -2.3, Z1W = 5.0, Z1D = 4.4;

buildRoom(Z1X, Z1Z, Z1W, Z1D, H, [
  { side: 'left', center: 0, width: 1.1 },
]);

// Windows on back wall (north, -z)
buildWindow(Z1X - 0.8, 1.35, Z1Z - Z1D/2 - 0.06, 0.95, 1.35);
buildWindow(Z1X + 1.0, 1.35, Z1Z - Z1D/2 - 0.06, 0.95, 1.35);

// Single bed along back-right wall
buildDoubleBed(Z1X + 0.6, Z1Z - 0.95);
buildNightstand(Z1X + 0.6 + 1.18, Z1Z - 0.95);

// USM shelving as desk/study unit on left wall
buildUSMShelf(Z1X - Z1W/2 + 0.21, Z1Z + 0.6, Math.PI/2, 3, 2);

// Writing table
buildSmallTable(Z1X - 1.4, Z1Z + 1.7);
buildEamesChair(Z1X - 1.4, Z1Z + 1.7 + 0.8, Math.PI);

// Floor lamp in reading corner
buildFloorLamp(Z1X + 1.9, Z1Z + 1.4);

// Rug
buildRug(Z1X + 0.4, Z1Z + 0.1, 2.8, 1.8);

// Books on table
buildBooks(Z1X - 1.9, 0.76, Z1Z + 1.7, 5);

// ─── CAMERA PATH ─────────────────────────────────────────────────────────────
// Smooth arc through Eltern → hallway → Zimmer 1
const pathPts = [
  new THREE.Vector3(EX - 1.8,  1.52, EZ + 1.4),   // 0 enter Eltern
  new THREE.Vector3(EX - 0.8,  1.55, EZ + 0.5),   // 1 look across room
  new THREE.Vector3(EX + 0.3,  1.55, EZ - 0.8),   // 2 toward bed
  new THREE.Vector3(EX + 0.8,  1.55, EZ + 0.4),   // 3 moving to door
  new THREE.Vector3(EX + 1.8,  1.55, EZ + 0.1),   // 4 at doorway
  new THREE.Vector3(HX - 0.2,  1.55, HZ + 0.2),   // 5 entering hallway
  new THREE.Vector3(HX + 0.4,  1.55, HZ - 0.4),   // 6 crossing hallway
  new THREE.Vector3(Z1X - 1.8, 1.55, Z1Z + 0.3),  // 7 entering Zimmer 1
  new THREE.Vector3(Z1X - 0.6, 1.55, Z1Z + 0.2),  // 8 panning left wall
  new THREE.Vector3(Z1X + 0.4, 1.52, Z1Z - 0.5),  // 9 toward bed
  new THREE.Vector3(Z1X + 1.5, 1.52, Z1Z + 0.8),  // 10 lamp corner
];

const curve = new THREE.CatmullRomCurve3(pathPts, false, 'catmullrom', 0.5);

// ─── STATE ───────────────────────────────────────────────────────────────────
let progress   = 0;     // current camera position (0-1)
let target     = 0;     // where we're gliding to
let velocity   = 0;
let pointerDown = false;
let lastPointerX = 0;
let lastT = performance.now();

// UI elements
const elRoomName = document.getElementById('room-name');
const elRoomSize = document.getElementById('room-size');
const elFill     = document.getElementById('fill');
const elHint     = document.getElementById('hint');

setTimeout(() => elHint.classList.add('hidden'), 4000);

function roomInfo(p) {
  if (p < 0.40) return ['Eltern', '21,95 m²'];
  if (p < 0.62) return ['Empore', '7,17 m²'];
  return ['Zimmer 1', '22,08 m²'];
}

// ─── INPUT ───────────────────────────────────────────────────────────────────
function pDown(x) { pointerDown = true; lastPointerX = x; velocity = 0; }
function pMove(x) {
  if (!pointerDown) return;
  const dx = x - lastPointerX;
  lastPointerX = x;
  const delta = -dx / window.innerWidth * 1.6;
  target = Math.max(0, Math.min(1, target + delta));
  velocity = delta * 0.5;
}
function pUp() {
  if (!pointerDown) return;
  pointerDown = false;
  target = Math.max(0, Math.min(1, target + velocity * 10));
}

renderer.domElement.addEventListener('mousedown',  e => pDown(e.clientX));
window.addEventListener('mousemove',               e => pMove(e.clientX));
window.addEventListener('mouseup',                 () => pUp());
renderer.domElement.addEventListener('touchstart', e => { e.preventDefault(); pDown(e.touches[0].clientX); }, { passive: false });
window.addEventListener('touchmove',               e => { e.preventDefault(); pMove(e.touches[0].clientX); }, { passive: false });
window.addEventListener('touchend',                e => { e.preventDefault(); pUp(); }, { passive: false });
window.addEventListener('wheel', e => {
  target = Math.max(0, Math.min(1, target + e.deltaY * 0.0004));
}, { passive: true });

// ─── ANIMATE ─────────────────────────────────────────────────────────────────
let prevRoomName = '';

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt  = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  // Lerp progress toward target
  progress += (target - progress) * Math.min(1, 7 * dt);
  progress = Math.max(0, Math.min(0.9999, progress));

  // Camera position along curve
  const pos = curve.getPointAt(progress);
  // Slight breathing bob
  pos.y += Math.sin(now * 0.0009) * 0.008;

  // Look ahead along curve for natural forward direction
  const lookT = Math.min(0.9999, progress + 0.055);
  const look = curve.getPointAt(lookT);
  // Add subtle lateral drift to look target for cinematic feel
  look.y += Math.sin(now * 0.0007) * 0.004;

  camera.position.copy(pos);
  camera.lookAt(look);

  // Update UI
  elFill.style.width = (progress * 100).toFixed(1) + '%';
  const [name, size] = roomInfo(progress);
  if (name !== prevRoomName) {
    elRoomName.textContent  = name;
    elRoomSize.textContent  = size;
    prevRoomName = name;
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
