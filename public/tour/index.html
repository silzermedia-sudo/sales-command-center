<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Tour · Demo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; touch-action: none; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; font-family: 'Helvetica Neue', sans-serif; }
    #label { position: absolute; top: 28px; left: 28px; color: rgba(255,245,220,0.85); font-size: 10px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
    #hint { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.45); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; transition: opacity 2s; }
    #hint.gone { opacity: 0; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; transition: opacity 0.8s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #bar-wrap { width: 120px; height: 1px; background: rgba(255,255,255,0.15); margin-top: 16px; }
    #bar { height: 100%; width: 0%; background: rgba(197,160,40,0.9); transition: width 0.2s; }
  </style>
</head>
<body>
<div id="loading"><span>Modell wird geladen</span><div id="bar-wrap"><div id="bar"></div></div></div>
<div id="ui">
  <div id="label">3D Tour · Demo</div>
  <div id="hint">Ein Finger · Drehen &nbsp;|&nbsp; Zwei Finger · Zoom</div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.158.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.158.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 1.5, 3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.88;
controls.target.set(0, 0.8, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffeedd, 0.6));
const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc8d8ff, 0.25);
fill.position.set(-3, 2, -3);
scene.add(fill);

const bar = document.getElementById('bar');
const loadingEl = document.getElementById('loading');
const hint = document.getElementById('hint');

new GLTFLoader().load(
  'https://threejs.org/examples/models/gltf/bath_day.glb',
  (gltf) => {
    const model = gltf.scene;
    const box3 = new THREE.Box3().setFromObject(model);
    const center = box3.getCenter(new THREE.Vector3());
    const size = box3.getSize(new THREE.Vector3());
    model.position.sub(center);
    model.position.y += size.y / 2;
    const maxDim = Math.max(size.x, size.y, size.z);
    camera.position.set(0, size.y * 0.55, maxDim * 1.5);
    controls.target.set(0, size.y * 0.25, 0);
    controls.maxDistance = maxDim * 5;
    controls.minDistance = maxDim * 0.08;
    controls.update();
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
    scene.add(model);
    bar.style.width = '100%';
    setTimeout(() => { loadingEl.classList.add('done'); setTimeout(() => hint.classList.add('gone'), 5000); }, 300);
  },
  (p) => { if (p.total > 0) bar.style.width = (p.loaded/p.total*100)+'%'; },
  (err) => { loadingEl.innerHTML = '<span style="color:rgba(255,120,100,0.8)">Laden fehlgeschlagen</span>'; console.error(err); }
);

(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
